# yaml-language-server: $schema=https://raw.githubusercontent.com/promptfoo/promptfoo/refs/heads/main/site/static/config-schema.json
description: "Skill Routing and Execution Evaluation Suite"

prompts:
  - id: task
    raw: "{{task}}"

providers:
  - id: anthropic:claude-agent-sdk
    label: opus
    config:
      apiKeyRequired: false
      model: opus
      working_dir: ..
      setting_sources: [project]
      plugins:
        - type: local
          path: ../plugins/primary
        - type: local
          path: ../plugins/engineering
      skills: [engineering:code-comments, primary:write-gooder, engineering:user-stories]
      append_allowed_tools: []

  - id: anthropic:claude-agent-sdk
    label: sonnet
    config:
      apiKeyRequired: false
      model: sonnet
      working_dir: ..
      setting_sources: [project]
      plugins:
        - type: local
          path: ../plugins/primary
        - type: local
          path: ../plugins/engineering
      skills: [engineering:code-comments, primary:write-gooder, engineering:user-stories]
      append_allowed_tools: []

tests:
  - description: code with inline comments triggers code-comments
    vars:
      task: Write an example node.js argument parser with inline comments
    assert:
      - type: skill-used
        value: engineering:code-comments
      - type: llm-rubric
        value: The source code contains terse comments that adhere to the code-comments skill
        provider:
          id: openrouter:openai/gpt-6-sol

  - description: prose request triggers write-gooder only
    vars:
      task: Write three paragraphs that document why a team should use Rust over C.
    assert:
      - type: skill-used
        value: primary:write-gooder
      - type: not-skill-used
        value:
          pattern: code-comments$
      - type: llm-rubric
        value: The prose is concise and avoids filler phrases and tell-tale signs of generated output.
        provider:
          id: openrouter:openai/gpt-6-sol

  - description: comparison table triggers neither skill
    vars:
      task: Write a pros and cons table that compares python and nodejs
    assert:
      - type: not-skill-used
        value:
          pattern: code-comments$
      - type: not-skill-used
        value:
          pattern: write-gooder$

  - description: a decision about what users want triggers user-stories
    vars:
      task: "We just decided that viewers must be able to pick up a video on any device where they stopped, because they switch between a phone and a TV. Record that in docs/user-stories/."
    assert:
      - type: skill-used
        value: engineering:user-stories

  - description: a code question does not trigger user-stories
    vars:
      task: Write an example node.js function that sums a list of numbers
    assert:
      - type: not-skill-used
        value:
          pattern: user-stories$
